[package]
name = "mornfold-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Mornfold domain core: scheduler, vault, notifications, settings. Shell-independent, testable on Linux."

# All Phase 1 dependencies are declared here up front so the parallel wave-2
# plans (01-05..01-09) never edit this file. Never add the desktop shell
# framework, a second SQLite binding or the all-in-one keyring crate here
# (see CLAUDE.md "What NOT to Use"); this crate must stay testable on Linux.
[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Not the umbrella `sqlite` feature: it would also enable `sqlite-load-extension`.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["log"] }
jiff = "0.2.38"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.9.1"
secrecy = "0.10.3"
base64 = "0.23.1"
keyring-core = "1.0.1"
quick-xml = "0.42.0"
ulid = "3.0.0"
url = "2.5.8"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# The workspace's only HTTP client (D-17 provider key tests, plan 01-06).
# rustls only (OS trust store via rustls-platform-verifier); no OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "system-proxy"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
wiremock = "0.6.5"
